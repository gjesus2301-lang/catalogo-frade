<style>
/* Layout: vitrina de grilla tipo app iOS — barra de cristal arriba, grilla de piezas, bandeja de pedido flotante abajo */
:root{
  --bg:#FADCDE; --surface:#FFFBF0; --fg:#2B2B2B; --topaz:#913939; --pink:#EAB7BA;
  --muted:rgba(43,43,43,.62); --line:rgba(145,57,57,.14);
  --gold:#D99B2E; --gold-grad:linear-gradient(90deg,#F6DF77,#F4D361 30%,#E7B646 60%,#D99B2E 80%,#D08F28);
  --gold-soft:rgba(234,183,186,.38); --ok:#913939; --warn:#913939; --wa:#913939;
  --glass:rgba(255,251,240,.62);
  --display:"Inter",-apple-system,system-ui,sans-serif;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --r:22px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px 10px}
.brand{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.32em;margin-right:-.32em}
.brand span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.search input{border:0;outline:0;background:none;font:inherit;color:var(--fg);width:100%;min-width:0}
.search svg{flex:none;color:var(--muted)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted);transition:.2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button small{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

.tiers{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:18px 6px;color:var(--muted);font-size:13px}
.tiers strong{color:var(--fg);font-weight:600}
.tiers .t{display:flex;gap:6px;align-items:baseline}
.tiers .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);align-self:center}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 14px;font-size:13px;color:var(--muted)}
.toolbar select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:140px}
@media(min-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px}}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
@media(hover:hover){.card:hover{transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(60,45,10,.45)}}
.ph{position:relative;aspect-ratio:4/5;max-width:100%;background:#fff;display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;left:10px;top:10px;font-size:11px;padding:4px 8px;border-radius:999px;background:var(--gold-soft);color:var(--warn);font-weight:500}
.info{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.sku{font-size:11px;letter-spacing:.12em;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-size:14px;font-weight:500;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.price{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.price b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.price span{font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.06em}
.sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add{margin-top:6px;height:38px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:500;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.step{margin-top:6px;height:38px;border-radius:12px;background:var(--gold-soft);display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.step button{width:34px;height:30px;border-radius:9px;font-size:18px;font-weight:500}
.step output{font-weight:600;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

/* bandeja */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.traybar{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--fg);color:var(--bg);border-radius:22px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px -18px rgba(0,0,0,.55);transform:translateY(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.traybar[data-empty="1"]{transform:translateY(140%)}
.traybar .l{flex:1;min-width:0}
.traybar .l b{font-size:17px;font-variant-numeric:tabular-nums}
.traybar .l small{display:block;font-size:12px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.18);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .35s}
.traybar .go{flex:none;background:var(--gold);color:#17150f;border-radius:14px;padding:10px 14px;font-weight:600}

/* hojas */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(10,9,7,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:9;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:760px){.sheet{left:50%;width:600px;margin-left:-300px}}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:10px auto 4px}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:6px max(18px,env(safe-area-inset-left,0px)) 10px}
.sh-head h2{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.04em;margin:0}
.x{width:32px;height:32px;border-radius:50%;background:var(--bg);font-size:18px}
.sh-body{overflow:auto;padding:0 18px 12px;flex:1}
.line{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:56px;height:70px;object-fit:contain;background:#fff;border-radius:10px}
.line .t{min-width:0}
.line .t div{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .t small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.line .step{margin:0;width:112px}
.nudge{margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--gold-soft);font-size:14px}
.nudge b{color:var(--warn)}
.sum{display:grid;gap:6px;padding:14px 0 4px;font-size:14px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between}
.sum .tot{font-size:20px;font-weight:600}
.sh-foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.wa{height:52px;border-radius:16px;background:var(--wa);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.note{font-size:12px;color:var(--muted);text-align:center}
.swap{font-size:13px;color:var(--muted);text-align:center}
.swap button{color:var(--fg);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:4px 2px;cursor:pointer}
.clear{font-size:13px;color:var(--muted);text-decoration:underline}

/* detalle */
.pd{display:grid;gap:16px}
.pd .ph{border-radius:18px;overflow:hidden}
.ptab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ptab div{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.ptab small{display:block;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.ptab b{font-size:16px;font-variant-numeric:tabular-nums}
.ptab .hi{border-color:var(--gold);background:var(--gold-soft)}

/* Marca FRADE (manual de uso): patrón, vidrio, logo */
body{background:var(--bg)}
.logo{height:34px;width:auto;color:var(--topaz);display:block}
.brand span{color:var(--topaz);letter-spacing:.32em;font-weight:600;font-size:9.5px;margin-top:7px}
header{border-bottom:1px solid rgba(255,255,255,.6)}
.search{background:rgba(255,251,240,.75);border-color:var(--line);border-radius:14px}
.seg button{background:rgba(255,251,240,.7);border-color:var(--line);color:var(--topaz)}
.seg button[aria-pressed="true"]{background:var(--topaz);color:var(--surface);border-color:var(--topaz)}
.hero{margin-top:16px;padding:16px 18px;border-radius:24px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.7);box-shadow:0 18px 40px -26px rgba(145,57,57,.45);position:relative}
.hero::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--gold-grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero h1{margin:0 0 4px;font-size:19px;font-weight:600;color:var(--topaz);letter-spacing:-.01em}
.hero .tiers{padding:6px 0 0;color:var(--fg)}
.hero .tiers strong{color:var(--topaz)}
.tiers .dot{background:var(--gold-grad)}
.toolbar{color:var(--topaz);font-weight:500}
.toolbar select{background:rgba(255,251,240,.8);border-color:var(--line);color:var(--topaz)}
.card{background:var(--surface);border-color:rgba(255,255,255,.8);box-shadow:0 10px 28px -22px rgba(145,57,57,.55)}
.price b{color:var(--topaz)}
.price span{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.add{background:var(--topaz);color:var(--surface);border-radius:999px;width:100%}
.step{border-radius:999px;color:var(--topaz)}
.badge{background:var(--surface);color:var(--topaz);border:1px solid var(--line)}
.badge.new{background:var(--gold-grad);color:#2B2B2B;border:0;font-weight:600;letter-spacing:.02em}
.traybar{background:rgba(145,57,57,.92);color:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:26px;box-shadow:0 20px 44px -18px rgba(145,57,57,.7)}
.bar{background:rgba(255,251,240,.22)}
.bar i{background:var(--gold-grad)}
.traybar .go{background:var(--gold-grad);color:#2B2B2B;border-radius:999px;padding:11px 16px}
.sheet{background:var(--surface)}
.sh-head h2{color:var(--topaz);font-weight:600;font-size:22px;letter-spacing:-.01em}
.x{background:var(--gold-soft);color:var(--topaz)}
.wa{background:var(--topaz);border-radius:999px}
.nudge{background:var(--gold-soft);color:var(--fg)}
.ptab .hi{border-color:var(--topaz);background:var(--gold-soft)}
.scrim{background:rgba(43,43,43,.4)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

const BY=Object.fromEntries(P.map(p=>[p.sku,p]));
const $=s=>document.querySelector(s);
const clp=n=>"$"+Math.round(n).toLocaleString("es-CL");
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cart=store.get("frade_cart",{}); for(const k in cart) if(!BY[k]) delete cart[k];
let cat="ALL",q="",sort="new";

function tier(n){return n>=6?"x6":n>=3?"x3":"det"}
function unit(p,t){ // nunca cobrar más por llevar más
  const order={det:["det"],x3:["x3","det"],x6:["x6","x3","det"]}[t];
  const v=order.map(k=>p[k]).filter(Boolean);
  return p[t]?Math.min(...v):0;
}
function totals(){
  const items=Object.entries(cart).filter(([,q])=>q>0);
  const pieces=items.reduce((a,[,q])=>a+q,0), t=tier(pieces);
  let sum=0,pend=0;
  const lines=items.map(([s,q])=>{const p=BY[s],u=unit(p,t); if(u) sum+=u*q; else pend+=q; return {p,q,u}});
  return {pieces,t,sum,pend,lines};
}
const TLABEL={det:"precio detalle",x3:"precio x3",x6:"precio x6"};

function renderSeg(){
  const counts={ALL:P.length}; P.forEach(p=>counts[p.cat]=(counts[p.cat]||0)+1);
  $("#seg").innerHTML=[["ALL","Todo"],...Object.entries(CATS).map(([k,v])=>[k,v[0]])]
    .map(([k,l])=>`<button aria-pressed="${k===cat}" data-cat="${k}">${l}<small>${counts[k]||0}</small></button>`).join("");
}
function cardActions(p){
  const n=cart[p.sku]||0;
  return n?`<div class="step"><button data-dec="${p.sku}" aria-label="Quitar uno">−</button><output>${n}</output><button data-inc="${p.sku}" aria-label="Agregar uno">+</button></div>`
          :`<button class="add" data-inc="${p.sku}">Agregar</button>`;
}
function renderGrid(){
  const qq=q.trim().toLowerCase();
  let list=P.filter(p=>(cat==="ALL"||p.cat===cat)&&(!qq||p.name.toLowerCase().includes(qq)||p.sku.toLowerCase().includes(qq)));
  const num=s=>parseInt(s.slice(2));
  list.sort(sort==="asc"?(a,b)=>a.x6-b.x6:sort==="desc"?(a,b)=>b.x6-a.x6:(a,b)=>((NI[a.sku]||1e9)-(NI[b.sku]||1e9))||num(b.sku)-num(a.sku)||a.cat.localeCompare(b.cat));
  $("#count").textContent=`${list.length} piezas`;
  $("#grid").innerHTML=list.length?list.map(p=>`
    <article class="card">
      <button class="ph" data-open="${p.sku}" aria-label="Ver ${p.name}"><img loading="lazy" src="img/${p.sku}.webp?v=${IV[p.sku]||""}" alt="${p.name}">${NI[p.sku]?`<span class="badge new">Nuevo ingreso</span>`:p.ok?"":`<span class="badge">Consultar disponibilidad</span>`}</button>
      <div class="info">
        <div class="sku">${p.sku}</div>
        <div class="name">${p.name}</div>
        <div class="price"><b>${clp(p.x6)}</b><span>X6</span></div>
        <div class="sub">${p.x3?`x3 ${clp(p.x3)} · detalle ${clp(p.det)}`:"x3 y detalle: consultar"}</div>
        <div data-act="${p.sku}">${cardActions(p)}</div>
      </div>
    </article>`).join(""):`<div class="empty">No encontramos piezas con “${q}”. Prueba con otro nombre o SKU.</div>`;
}
function refreshCard(s){const el=document.querySelector(`[data-act="${s}"]`); if(el) el.innerHTML=cardActions(BY[s]);}
function renderTray(){
  const T=totals();
  $("#tray").dataset.empty=T.pieces?"0":"1";
  $("#tTot").textContent=clp(T.sum)+(T.pend?" +":"");
  const next=T.pieces<3?3:T.pieces<6?6:0;
  $("#tMsg").textContent=`${T.pieces} pieza${T.pieces===1?"":"s"} · ${TLABEL[T.t]}`+(next?` · ${next-T.pieces} más para ${next===3?"x3":"x6"}`:" aplicado");
  $("#tBar").style.width=Math.min(100,T.pieces/6*100)+"%";
}
function seller(){
  let s=store.get("frade_seller",null);
  if(!s||!SELLERS.find(x=>x.p===s)){s=SELLERS[Math.floor(Math.random()*SELLERS.length)].p;store.set("frade_seller",s)}
  return SELLERS.find(x=>x.p===s);
}
function renderCart(){
  const T=totals(), S=seller();
  if(!T.pieces){$("#cartBody").innerHTML=`<div class="empty">Tu pedido está vacío.<br>Agrega piezas desde el catálogo.</div>`;$("#waBtn").hidden=true;$("#swap").innerHTML="";return}
  $("#waBtn").hidden=false;
  const next=T.pieces<3?3:T.pieces<6?6:0;
  let save="";
  if(next){const nt=tier(next); const now=T.sum, then=T.lines.reduce((a,l)=>a+(unit(l.p,nt)||0)*l.q,0); const d=now-then; if(d>0) save=` y ahorras <b>${clp(d)}</b> en lo que ya elegiste`;}
  $("#cartBody").innerHTML=T.lines.map(l=>`
    <div class="line"><img src="img/${l.p.sku}.webp?v=${IV[l.p.sku]||""}" alt="">
      <div class="t"><div>${l.p.name}</div><small>${l.p.sku} · ${l.u?clp(l.u)+" c/u":"precio a confirmar"}</small></div>
      <div class="step"><button data-dec="${l.p.sku}" aria-label="Quitar uno">−</button><output>${l.q}</output><button data-inc="${l.p.sku}" aria-label="Agregar uno">+</button></div>
    </div>`).join("")
    +(next?`<div class="nudge">Agrega <b>${next-T.pieces} pieza${next-T.pieces===1?"":"s"}</b> más (cualquier modelo) para pasar a ${next===3?"precio x3":"precio x6"}${save}.</div>`:`<div class="nudge">Tienes <b>precio x6</b> en todo tu pedido.</div>`)
    +`<div class="sum"><div><span>Piezas</span><span>${T.pieces}</span></div><div><span>Precio aplicado</span><span>${TLABEL[T.t]}</span></div>${T.pend?`<div><span>Por confirmar</span><span>${T.pend} pieza${T.pend===1?"":"s"}</span></div>`:""}<div class="tot"><span>Total estimado</span><span>${clp(T.sum)}</span></div></div>
    <p style="text-align:center"><button class="clear" id="clear">Vaciar pedido</button></p>`;
  $("#waTxt").textContent=`Enviar pedido a ${S.n}`;
  const O=SELLERS.find(x=>x.p!==S.p);
  $("#swap").innerHTML=O?`¿Ya compras con alguien? <button id="swapBtn" data-to="${O.p}">Enviar a ${O.n}</button>`:"";
  const msg=[`Hola ${S.n}, quiero cotizar este pedido del catálogo FRADE:`,"",
    ...T.lines.map(l=>`• ${l.p.sku} ${l.p.name} × ${l.q} — ${l.u?clp(l.u)+" c/u":"precio a confirmar"}`),"",
    `Total piezas: ${T.pieces} (${TLABEL[T.t]})`,`Total estimado: ${clp(T.sum)}${T.pend?" + piezas por confirmar":""}`].join("\n");
  $("#waBtn").href=`https://wa.me/${S.p}?text=${encodeURIComponent(msg)}`;
}
function renderDetail(s){
  const p=BY[s], n=cart[s]||0;
  $("#dSku").textContent=p.sku;
  const cell=(k,l)=>`<div class="${k==="x6"?"hi":""}"><small>${l}</small><b>${p[k]?clp(p[k]):"Consultar"}</b></div>`;
  $("#dBody").innerHTML=`<div class="pd"><div class="ph"><img src="img/${p.sku}.webp?v=${IV[p.sku]||""}" alt="${p.name}"></div>
    <div><div class="name" style="font-size:18px;min-height:0">${p.name}</div><div class="sub">${CATS[p.cat][0]}${NI[p.sku]?" · Nuevo ingreso":""}${p.ok?"":" · consultar disponibilidad"}</div></div>
    <div class="ptab">${cell("det","Detalle 1–2")}${cell("x3","x3 · 3–5")}${cell("x6","x6 · 6+")}</div>
    <div data-act="${p.sku}">${cardActions(p)}</div><div style="height:8px"></div></div>`;
}
function openSheet(id){$("#scrim").classList.add("on");$(id).classList.add("on")}
function closeAll(){$("#scrim").classList.remove("on");document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on"))}
function change(s,d){cart[s]=Math.max(0,(cart[s]||0)+d); if(!cart[s]) delete cart[s]; store.set("frade_cart",cart);
  document.querySelectorAll(`[data-act="${s}"]`).forEach(el=>el.innerHTML=cardActions(BY[s])); renderTray(); if($("#cart").classList.contains("on")) renderCart();}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");
  if(!t) {if(e.target.id==="scrim") closeAll(); return}
  if(t.dataset.cat){cat=t.dataset.cat;renderSeg();renderGrid();window.scrollTo({top:0})}
  else if(t.dataset.inc) change(t.dataset.inc,1);
  else if(t.dataset.dec) change(t.dataset.dec,-1);
  else if(t.dataset.open){renderDetail(t.dataset.open);openSheet("#detail")}
  else if(t.id==="openCart"){renderCart();openSheet("#cart")}
  else if(t.hasAttribute("data-close")) closeAll();
  else if(t.id==="swapBtn"){store.set("frade_seller",t.dataset.to);renderCart()}
  else if(t.id==="clear"){cart={};store.set("frade_cart",cart);renderGrid();renderTray();renderCart()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape") closeAll()});
$("#q").addEventListener("input",e=>{q=e.target.value;renderGrid()});
$("#sort").addEventListener("change",e=>{sort=e.target.value;renderGrid()});
renderSeg();renderGrid();renderTray();
</script>

</body>
</html>
